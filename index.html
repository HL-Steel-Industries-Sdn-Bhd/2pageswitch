<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, initial-scale=1.0" />
  <title>双页切换测试</title>
  <style>
    :root{ --duration: 500ms }
    html,body{ width:100%; height:100%; margin:0; padding:0; overflow:hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial }
    .stage{
      position:fixed; top:0; left:0; width:100vw; height:100vh; overflow:hidden; background:linear-gradient(135deg,#f6f8ff,#fff); display:flex; align-items:center; justify-content:center;
    }
    .page{
      position:absolute; inset:0; display:flex; flex-direction:column; align-items:flex-start; padding:20px; box-sizing:border-box; transition:transform var(--duration) ease, opacity var(--duration) ease;
      backface-visibility:hidden; will-change:transform,opacity;
    }
    .page h1{ margin:0; font-size:24px }

    .page.page-1{ background: linear-gradient(180deg,#fff,#e8f0ff); z-index:2 }
    .page.page-2{ background: linear-gradient(180deg,#fff7f0,#ffecec); transform: translateX(100%); opacity:0; z-index:1 }
    .page.show-1{ transform: translateX(0); opacity:1 }
    .page.show-2{ transform: translateX(0); opacity:1 }

    .toggle-wrap{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:10 }
    .toggle{
      width:88px; height:88px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12); background:linear-gradient(135deg,#ffffff,#f0f0f0); border:4px solid rgba(255,255,255,0.6);
      transition: transform 300ms ease, box-shadow 300ms ease;
    }
    .toggle:active{ transform:scale(0.96) }
    .toggle .icon{ display:block; font-weight:700; font-size:18px }
    .toggle.spin{ animation:spin var(--duration) linear }
    @keyframes spin{ from{ transform: rotate(0deg)} to{ transform: rotate(360deg)} }

    .hint{ position:absolute; bottom:18px; left:50%; transform:translateX(-50%); font-size:13px; opacity:0.7 }

    @media (max-width:420px){ .toggle{ width:72px; height:72px } .toggle .icon{ font-size:16px } }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <section class="page page-1 show-1" id="page1">
      <h1>你好</h1>
      <div style="flex:1; display:flex; align-items:center; justify-content:center">
        <p>这是第一页。请按中间的圆钮切换到第二页。</p>
      </div>
    </section>

    <section class="page page-2" id="page2">
      <h1>不知道</h1>
      <div style="flex:1; display:flex; align-items:center; justify-content:center">
        <p>这是第二页。再次按中间的圆钮切换回第一页。</p>
      </div>
    </section>

    <div class="toggle-wrap">
      <button id="toggleBtn" class="toggle" aria-label="切换页面">
        <span class="icon">↺</span>
      </button>
    </div>

    <div class="hint">点击圆钮在两页之间来回切换</div>
  </div>

  <script>
    const btn = document.getElementById('toggleBtn');
    const p1 = document.getElementById('page1');
    const p2 = document.getElementById('page2');
    let showing = 1;

    function showPage(n){
      if(n===1){
        p1.classList.add('show-1');
        p2.classList.remove('show-2');
        p2.style.transform = 'translateX(100%)';
        p2.style.opacity = '0';
        p1.style.transform = 'translateX(0)';
        p1.style.opacity = '1';
      } else {
        p2.classList.add('show-2');
        p1.classList.remove('show-1');
        p2.style.transform = 'translateX(0)';
        p2.style.opacity = '1';
        p1.style.transform = 'translateX(-100%)';
        p1.style.opacity = '0';
      }
      showing = n;
    }

    btn.addEventListener('click', ()=>{
      btn.classList.add('spin');
      setTimeout(()=> btn.classList.remove('spin'), 500);
      showPage(showing===1?2:1);
    });

    p2.addEventListener('click', (e)=>{
      if(e.target === btn || btn.contains(e.target)) return;
      showPage(1);
    });

    btn.addEventListener('keydown', (e)=>{
      if(e.key === ' ' || e.key === 'Enter'){
        e.preventDefault(); btn.click();
      }
    });

    showPage(1);
  </script>
</body>
</html>
