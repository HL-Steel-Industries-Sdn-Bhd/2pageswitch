<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多页面切换示例</title>
<style>
  body {
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #f0f8ff, #dceeff);
    font-family: sans-serif;
    flex-direction: column;
  }

  .page {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .active {
    display: flex;
  }

  button {
    margin: 10px;
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #007bff;
    color: white;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #0056b3;
  }

  h1 {
    margin-bottom: 15px;
  }
</style>
</head>
<body>

<!-- 主页面 -->
<div id="main" class="page active">
  <h1>Main Page</h1>
  <div>
    <button onclick="showPage(1)">Page 1</button>
    <button onclick="showPage(2)">Page 2</button>
    <button onclick="showPage(3)">Page 3</button>
    <button onclick="showPage(4)">Page 4</button>
    <button onclick="showPage(5)">Page 5</button>
    <button onclick="showPage(6)">Page 6</button>
  </div>
</div>

<!-- 六个子页面 -->
<div id="page1" class="page">
  <h1>Page 1</h1>
  <button onclick="back()">返回主页面</button>
</div>

<div id="page2" class="page">
  <h1>Page 2</h1>
  <button onclick="back()">返回主页面</button>
</div>

<div id="page3" class="page">
  <h1>Page 3</h1>
  <button onclick="back()">返回主页面</button>
</div>

<div id="page4" class="page">
  <h1>Page 4</h1>
  <button onclick="back()">返回主页面</button>
</div>

<div id="page5" class="page">
  <h1>Page 5</h1>
  <button onclick="back()">返回主页面</button>
</div>

<div id="page6" class="page">
  <h1>Page 6</h1>
  <button onclick="back()">返回主页面</button>
</div>

<script>
  function showPage(n) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page' + n).classList.add('active');
  }

  function back() {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('main').classList.add('active');
  }
</script>

</body>
</html>
